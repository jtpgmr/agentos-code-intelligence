[project]
name = "agentos-docker"
version = "1.0.0"
description = "AgentOS: a production runtime for agents. Self-hosted Docker sibling of the agentos template family."
requires-python = ">=3.14,<4"
readme = "README.md"
license-files = ["LICENSE"]
authors = [{ name = "Agno", email = "hello@agno.com" }]

dependencies = [
  "ag-ui-protocol==1.0.0",
  "agno[agui,os]==3.0.4",
  "agnoctl==0.2.0",
  "annotated-doc==0.0.5",
  "annotated-types==0.8.0",
  "anyio==4.14.2",
  "cel-python==0.5.0",
  "certifi==2026.7.22",
  "charset-normalizer==3.5.1",
  "click==8.5.0",
  "colorama==0.4.6 ; sys_platform == 'win32'",
  "croniter==6.2.4",
  "distro==1.9.0",
  "docstring-parser==0.18.0",
  "fastapi==0.141.1",
  "google-re2==1.1.20251105",
  "greenlet==3.5.6 ; platform_machine == 'AMD64' or platform_machine == 'WIN32' or platform_machine == 'aarch64' or platform_machine == 'amd64' or platform_machine == 'ppc64le' or platform_machine == 'win32' or platform_machine == 'x86_64'",
  "h11==0.16.0",
  "h2==4.4.1",
  "hpack==4.2.0",
  "httpcore==1.0.9",
  "httpcore2==2.12.0 ; sys_platform != 'emscripten'",
  "httpx==0.28.1",
  "httpx2==2.12.0",
  "httpx2-jsfetch==1.0 ; sys_platform == 'emscripten'",
  "hyperframe==6.1.0",
  "idna==3.19",
  "jiter==0.16.0",
  "jmespath==1.1.0",
  "jsonpatch==1.33",
  "jsonpointer==3.1.1",
  "lark==1.3.1",
  "markdown-it-py==4.2.0",
  "mdurl==0.1.2",
  "openai==3.6.0",
  "openinference-instrumentation==0.1.59",
  "openinference-instrumentation-agno==1.0.6",
  "openinference-semantic-conventions==0.1.33",
  "opentelemetry-api==1.44.0",
  "opentelemetry-instrumentation==0.65b0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-semantic-conventions==0.65b0",
  "packaging==26.3",
  "parallel-web==1.3.2",
  "pendulum==3.2.0",
  "pgvector>=0.5.0",
  "pillow==12.3.0",
  "prompt-toolkit==3.0.53",
  "pydantic==2.13.5",
  "pydantic-core==2.46.5",
  "pydantic-settings==2.15.0",
  "pygments==2.21.0",
  "pyjwt==2.13.0",
  "python-dateutil==2.9.0.post0",
  "python-dotenv==1.2.3",
  "python-multipart==0.0.32",
  "pytz==2026.3.post1",
  "pyyaml==6.0.3",
  "questionary==2.1.1",
  "reportlab==5.0.1",
  "rich==15.0.0",
  "shellingham==1.5.4",
  "six==1.17.0",
  "sniffio==1.3.1",
  "sqlalchemy==2.0.52",
  "starlette==1.6.0",
  "truststore==0.10.4 ; sys_platform != 'emscripten'",
  "typer==0.27.2",
  "typing-extensions==4.16.0",
  "typing-inspection==0.4.4",
  "tzdata==2026.3",
  "uvicorn==0.52.4",
  "wcwidth==0.8.3",
  "websockets==17.1",
  "wrapt==2.4.0",
]

[project.optional-dependencies]
dev = ["mypy", "ruff"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "app*", "db*", "evals*", "teams*", "workflows*"]
namespaces = false

[tool.ruff]
line-length = 120
exclude = [".venv*", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
# tmp/ is untracked scratch space — never part of the validated tree.
exclude = [".venv*", "tmp"]
